<sb-layout-auth>
    <div class="lg-card">
        <div class="lg-panel">
            <img *ngIf="(branding.changes | async)?.logoLogin as logo" [src]="logo" class="lg-logo" alt="logo" />
            <div class="lg-title">{{ (branding.changes | async)?.loginHeading || 'Server Panel' }}</div>
            <div class="lg-sub">{{ (branding.changes | async)?.loginTagline || 'Sign in to the server panel' }}</div>

            <div class="lg-error" *ngIf="failure">{{ failure }}</div>

            <form (ngSubmit)="login()">
                <div class="lg-field">
                    <label class="lg-label" for="lgUser">USERNAME</label>
                    <input id="lgUser" type="text" autocomplete="username" placeholder="Enter username"
                           [(ngModel)]="username" [ngModelOptions]="{standalone: true}" />
                </div>
                <div class="lg-field">
                    <label class="lg-label" for="lgPass">PASSWORD</label>
                    <input id="lgPass" type="password" autocomplete="current-password" placeholder="Enter password"
                           [(ngModel)]="password" [ngModelOptions]="{standalone: true}" />
                </div>
                <label class="lg-remember">
                    <input type="checkbox" [(ngModel)]="remember" [ngModelOptions]="{standalone: true}" /> Remember me
                </label>
                <button type="submit" class="lg-btn" [disabled]="!username || !password">Sign In</button>
            </form>

            <div class="lg-foot">Served locally by DayZ Server Manager</div>
        </div>
    </div>
</sb-layout-auth>
